[package]
name = "idm-clone"
version = "0.1.1"
description = "Local high-speed Windows download manager"
edition = "2021"

[lib]
name = "idm_clone_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-autostart = "2"
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2"
tauri-plugin-shell = "2"
tauri-plugin-single-instance = "2"
window-vibrancy = "0.6"

tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["rt"] }
async-trait = "0.1"
futures-util = "0.3"

serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
thiserror = "2"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
rand = "0.8"
hex = "0.4"

reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream", "http2", "http3", "charset"] }
librqbit = { version = "9.1", default-features = false, features = ["rust-tls"] }
axum = { version = "0.8", features = ["ws"] }
tower-http = { version = "0.6", features = ["cors"] }
governor = "0.8"

sha2 = "0.10"
md-5 = "0.10"
regex = "1"
url = "2"

sysinfo = "0.33"
windows = { version = "0.58", features = ["Win32_UI_Shell", "Win32_Foundation", "Win32_System_DataExchange", "Win32_System_Memory"] }

zip = "2"
sevenz-rust = "0.6"

[dev-dependencies]
tempfile = "3"
wiremock = "0.6"
